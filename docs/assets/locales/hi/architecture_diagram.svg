<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1328"/>
      <stop offset="100%" stop-color="#070a16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1000" height="390" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="998" height="388" rx="13" fill="none" stroke="#1e293b" stroke-width="1.4"/>

  <!-- Title Header Bar -->
  <text x="500" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" filter="url(#glow)">
    .NET मेटाडेटा रिवर्स इंजीनियरिंग और पीई ओवरले फोरेंसिक पाइपलाइन
  </text>

  <!-- 4 Cards -->
  <!-- Card 1 -->
  <g transform="translate(24, 60)">
    <rect width="226" height="300" rx="10" fill="#090e1c" stroke="#0284c7" stroke-width="1.4"/>
    <rect width="226" height="38" rx="10" fill="#0e2238"/>
    <rect y="26" width="226" height="12" fill="#0e2238"/>
    <circle cx="16" cy="19" r="4.5" fill="#7dd3fc" filter="url(#glow)"/>
    <text x="28" y="23" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800">1. लक्षित बाइनरी इनपुट</text>
    <line x1="0" y1="38" x2="226" y2="38" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>
    
    <text x="12" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• पैक किया गया PE / .NET कंटेनर</text>
    <text x="22" y="72" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">PE32/PE32+ हेडर पार्सिंग</text>
    
    <text x="12" y="102" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• अस्पष्ट CIL बाइटकोड</text>
    <text x="22" y="118" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">ConfuserEx, Reactor, Babel</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(266, 60)">
    <rect width="226" height="300" rx="10" fill="#090e1c" stroke="#6366f1" stroke-width="1.4"/>
    <rect width="226" height="38" rx="10" fill="#1e1b4b"/>
    <rect y="26" width="226" height="12" fill="#1e1b4b"/>
    <circle cx="16" cy="19" r="4.5" fill="#a5b4fc" filter="url(#glow)"/>
    <text x="28" y="23" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800">2. पीई ओवरले निष्कर्षण</text>
    <line x1="0" y1="38" x2="226" y2="38" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
    
    <text x="12" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• अनुभाग सीमा गणना</text>
    <text x="22" y="72" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">max(PointerToRawData + Size)</text>
    
    <text x="12" y="102" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• xorPacker दोहरा XOR प्रतिलोम</text>
    <text x="22" y="118" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">प्रतीक '***' + 'randomkey'</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(508, 60)">
    <rect width="226" height="300" rx="10" fill="#090e1c" stroke="#9333ea" stroke-width="1.4"/>
    <rect width="226" height="38" rx="10" fill="#3b0764"/>
    <rect y="26" width="226" height="12" fill="#3b0764"/>
    <circle cx="16" cy="19" r="4.5" fill="#d8b4fe" filter="url(#glow)"/>
    <text x="28" y="23" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800">3. सीएलआर मेटाडेटा फोरेंसिक</text>
    <line x1="0" y1="38" x2="226" y2="38" stroke="#9333ea" stroke-width="1" stroke-opacity="0.4"/>
    
    <text x="12" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• सीएलआई स्ट्रीम और एन्ट्रॉपी</text>
    <text x="22" y="72" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">#Strings, #US स्ट्रीम स्कैन</text>
    
    <text x="12" y="102" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• 8 रक्षक हस्ताक्षर पहचान</text>
    <text x="22" y="118" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">Anti-Tamper और JIT डिक्रिप्शन</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(750, 60)">
    <rect width="226" height="300" rx="10" fill="#090e1c" stroke="#ea580c" stroke-width="1.4"/>
    <rect width="226" height="38" rx="10" fill="#431407"/>
    <rect y="26" width="226" height="12" fill="#431407"/>
    <circle cx="16" cy="19" r="4.5" fill="#fdba74" filter="url(#glow)"/>
    <text x="28" y="23" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800">4. पुनर्निर्मित आउटपुट</text>
    <line x1="0" y1="38" x2="226" y2="38" stroke="#ea580c" stroke-width="1" stroke-opacity="0.4"/>
    
    <text x="12" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• बिटवाइज़ स्टैंडअलोन PE रिकवरी</text>
    <text x="22" y="72" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">प्रत्यक्ष MZ पेलोड डंप</text>
    
    <text x="12" y="102" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• उत्पादन SIEM टेलीमेट्री</text>
    <text x="22" y="118" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="9.5">एन्ट्रॉपी मेट्रिक्स और JSON</text>
  </g>

  <!-- Connecting Arrows -->
  <path d="M 250 210 L 264 210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 492 210 L 506 210" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 734 210 L 748 210" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer Line -->
  <text x="500" y="378" fill="#475569" font-family="ui-monospace, Consolas, monospace" font-size="10" text-anchor="middle">
    Maya Thorne · .NET Assembly &amp; PE Overlay Forensics · Zero-Overflow Multilingual Architecture
  </text>
</svg>