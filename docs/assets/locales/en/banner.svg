<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 245" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.38"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="920" height="245" rx="14" fill="url(#bgGrad)"/>
  <rect width="920" height="245" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="918" height="243" rx="13" fill="none" stroke="#1e293b" stroke-width="1.3"/>

  <circle cx="118" cy="122" r="82" fill="#38bdf8" opacity="0.12" filter="blur(38px)"/>
  <circle cx="790" cy="125" r="88" fill="#c084fc" opacity="0.11" filter="blur(42px)"/>

  <!-- Left Disassembler & CLR Schematic -->
  <g transform="translate(48, 46)">
    <rect x="0" y="0" width="136" height="152" rx="10" fill="#091122" stroke="#1e3a5f" stroke-width="1.8"/>
    <rect x="6" y="6" width="124" height="140" rx="7" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="18 8" filter="url(#glow)"/>
    <text x="16" y="26" fill="#38bdf8" font-family="Consolas, monospace" font-size="10" font-weight="700">CLR_RVA: 0x2050</text>
    <text x="16" y="42" fill="#818cf8" font-family="Consolas, monospace" font-size="10" font-weight="700">#Strings Stream</text>
    <text x="16" y="58" fill="#c084fc" font-family="Consolas, monospace" font-size="10" font-weight="700">OVERLAY: '***'</text>
    <line x1="16" y1="68" x2="120" y2="68" stroke="#1e293b" stroke-width="1.2"/>
    <text x="16" y="84" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">XOR(K_dyn, K_m)</text>
    <text x="16" y="100" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">DECRYPT: MZ PE</text>
    <text x="16" y="116" fill="#38bdf8" font-family="Consolas, monospace" font-size="9.5">ENTROPY: 7.92</text>
    <text x="16" y="134" fill="#34d399" font-family="Consolas, monospace" font-size="10" font-weight="800">STATE: UNPACKED</text>
  </g>

  <!-- Center Typography -->
  <g transform="translate(216, 50)">
    <rect x="0" y="0" width="240" height="22" rx="11" fill="#0b1b36" stroke="#0284c7" stroke-width="1.1"/>
    <text x="12" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.2">.NET REVERSE ENGINEERING ARCHIVE</text>

    <text x="0" y="62" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="0.4" filter="url(#glow)">
      DOTNET PACKER FORENSICS
    </text>

    <text x="0" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      Static Unpacker &amp; Metadata Analysis for .NET &amp; Native PE Packers
    </text>

    <!-- 4 Feature Badges -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="108" height="26" rx="6" fill="#0a192f" stroke="#0284c7" stroke-width="1.1"/>
      <text x="54" y="17" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">PE Overlay Carve</text>

      <rect x="116" y="0" width="112" height="26" rx="6" fill="#140f2d" stroke="#6366f1" stroke-width="1.1"/>
      <text x="172" y="17" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Dual-XOR Inversion</text>

      <rect x="236" y="0" width="112" height="26" rx="6" fill="#1b1236" stroke="#9333ea" stroke-width="1.1"/>
      <text x="292" y="17" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">CLR Metadata Scan</text>

      <rect x="356" y="0" width="124" height="26" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.1"/>
      <text x="418" y="17" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">8 Protector Signatures</text>
    </g>
  </g>

  <!-- Right Decorative Microchip -->
  <g transform="translate(730, 48)">
    <rect x="0" y="0" width="144" height="148" rx="10" fill="#091122" stroke="#312e81" stroke-width="1.8"/>
    <circle cx="72" cy="74" r="38" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="72" cy="74" r="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
    <text x="72" y="79" fill="#c7d2fe" font-family="Consolas, monospace" font-size="11" font-weight="900" text-anchor="middle">.NET CLR</text>
  </g>
</svg>