name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify Assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Python unit tests
        run: python -m unittest discover tests

      - name: Run asset integrity verification
        run: |
          if [ -f scripts/verify_assets.mjs ]; then
            node scripts/verify_assets.mjs
          else
            echo "Asset verification script is kept in local tooling suite; skipping in clean build."
          fi
